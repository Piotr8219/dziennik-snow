<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Usuń opinię — Dziennik Snów</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at 50% 0%, #1b1640, #060913 60%); color: #f3f4f6; }
    .box { max-width: 420px; width: 100%; text-align: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 20px; padding: 28px 22px; }
    h1 { font-size: 1.4rem; margin: 10px 0; }
    p { color: #9ca3af; }
    button { margin-top: 14px; width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #dc2626, #f97316); cursor: pointer; }
    button:disabled { opacity: .5; }
    a { color: #c4b5fd; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:2.4rem">🗑️</div>
    <h1>Usunąć opinię?</h1>
    <p id="msg">Opinia zniknie ze strony na zawsze.</p>
    <button id="del">Tak, usuń opinię</button>
    <p style="margin-top:18px"><a href="./#opinie">Przejdź do strony</a></p>
  </div>
  <script>
    const SUPABASE_URL = "https://qtbjrwcwatxgsuwaxklf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_AY0XDT4l0agvrRNAkUfjAg_65SUa3zf";
    const q = new URLSearchParams(location.search), id = Number(q.get("id")), t = q.get("t");
    const msg = document.getElementById("msg"), btn = document.getElementById("del");
    if (!id || !t) { msg.textContent = "Ten link jest niepełny."; btn.hidden = true; }
    btn.onclick = async () => {
      btn.disabled = true; msg.textContent = "Usuwam…";
      try {
        const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/usun_opinie", {
          method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ p_id: id, p_token: t })
        });
        const ok = r.ok && (await r.json()) === true;
        msg.textContent = ok ? "Gotowe ✓ Opinia została usunięta." : "Ta opinia jest już usunięta albo link jest nieprawidłowy.";
        btn.hidden = true;
      } catch (e) { msg.textContent = "Brak połączenia. Spróbuj ponownie."; btn.disabled = false; }
    };
  </script>
</body>
</html>
